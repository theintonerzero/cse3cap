name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A second push to the same branch cancels the first. Runs are not free
# and nobody reads the result of a superseded one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # openapi.yaml is what the frontend generates its types from and what
      # prism mocks. A contract that does not parse breaks both, and it
      # breaks them somewhere else, so it is checked first and on its own.
      - name: Lint the OpenAPI contract
        run: npx -y @redocly/cli@latest lint docs/openapi.yaml

      # CAP-25. Both halves of the seam against the contract, in one job:
      # web/src/api/schema.ts must be what the contract generates, and
      # Laravel's routes must be its operations. Each drifts silently
      # otherwise (docs/Frontend-and-Backend.md, "What breaks quietly").
      # PHP is here only so route:list can boot the router. No database.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, intl
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp ../.env.example .env
          php artisan key:generate

      - name: Check the route comparison's cases
        run: python3 scripts/contract-routes.test.py

      # Offline cases only. The register itself needs the network and is
      # regenerated by hand with ./run deps, not in CI.
      - name: Check the dependency register's cases
        run: python3 scripts/dependency-register.test.py

      - name: Check for contract drift
        run: bash scripts/check-contract-drift.sh

      # The guard that stops a shell command dropping the shared schema.
      # It is only as good as its cases, and it has already been wrong
      # once, so the cases run on every push.
      - name: Check the shared-database guard
        run: python3 scripts/guard-shared-db.test.py

      - name: Check the docs-location guard
        run: python3 scripts/guard-docs-location.test.py

      # Each business rule has exactly one home (CLAUDE.md). Pure grep.
      - name: Check every business rule has one home
        run: bash scripts/check-one-rule.sh

      - name: Check the design-token check's cases
        run: python3 scripts/check-tokens.test.py

      # The docs still describe the repository: relative links resolve,
      # ./run commands exist, docs/ is in the README table, the ADR index
      # matches the records, and the dependency register matches the
      # lockfiles. The handover audit found every one of these broken by hand.
      - name: Check the docs checker's cases
        run: python3 scripts/check-docs.test.py

      - name: Check the docs describe the repository
        run: python3 scripts/check-docs.py

      # Nobody on the team runs Windows day to day, so the PowerShell
      # installer is the one file that can rot unnoticed until a new
      # teammate cannot start. pwsh ships on the GitHub runners.
      - name: Check the Windows installer
        shell: pwsh
        run: ./scripts/setup.ps1.test.ps1

      # run.ps1 has no behavioural test: starting two servers and killing
      # them is not something to assert in CI. Parsing is the floor, and it
      # is the failure that would otherwise reach a teammate first.
      - name: Check the Windows task runner parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./run.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "run.ps1 parses"

  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Its own MySQL, not the shared instance. The suite runs migrate:fresh,
    # which drops every table, and five people work against rddb. Same major
    # version as production so the generated columns, CHECK constraints and
    # window functions behave the same.
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: reflection_diary_test_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, xml, intl, zip, sodium
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Write the environment
        working-directory: api
        run: |
          cp ../.env.example .env
          php artisan key:generate

      - name: Check formatting
        working-directory: api
        run: ./vendor/bin/pint --test

      # No TLS here. MYSQL_ATTR_SSL_CA is emptied deliberately: the service
      # container speaks plaintext on localhost, while the shared instance
      # refuses unencrypted connections and needs the CA. config/database.php
      # filters the option out when it is empty.
      - name: Run the test suite
        working-directory: api
        env:
          DB_CONNECTION: mysql_test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ci
          DB_TEST_DATABASE: reflection_diary_test_ci
          MYSQL_ATTR_SSL_CA: ''
        run: php artisan test

      # The suite proves each rule with Sanctum::actingAs. scripts/smoke.sh
      # proves the pieces fit over real HTTP with real tokens: middleware,
      # the token guard, the queued export, the download. It used to run
      # only by hand, so "55 smoke checks" was a claim nobody re-checked.
      #
      # Same throwaway container, rebuilt: migrate:fresh --seed lays down the
      # demo, which leaves Jane's third La Trobe sprint free so the write path
      # runs rather than being skipped. DemoSeeder prints the three tokens
      # once; that output is the file smoke.sh reads them from.
      # --drop-views because the schema migration creates the analytics views
      # and migrate:fresh drops only tables by default; the suite does the
      # same with $dropViews in tests/TestCase.php. shell: bash adds pipefail,
      # so a failed seed cannot hide behind the tee.
      - name: Seed the demo for the smoke run
        shell: bash
        working-directory: api
        env:
          DB_CONNECTION: mysql_test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ci
          DB_TEST_DATABASE: reflection_diary_test_ci
          MYSQL_ATTR_SSL_CA: ''
        run: php artisan migrate:fresh --drop-views --seed --force --no-interaction --no-ansi | tee "$RUNNER_TEMP/seed.txt"

      - name: Smoke test over HTTP
        shell: bash
        env:
          DB_CONNECTION: mysql_test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ci
          DB_TEST_DATABASE: reflection_diary_test_ci
          MYSQL_ATTR_SSL_CA: ''
          TOKENS: ${{ runner.temp }}/seed.txt
        run: |
          (cd api && php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/serve.log" 2>&1 &)
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/up && break
            sleep 1
          done
          bash scripts/smoke.sh

      - name: Show the API log if the smoke run failed
        if: failure()
        run: cat "$RUNNER_TEMP/serve.log" || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Written before web/ existed, so the first frontend PR arrived to a
      # pipeline that already ran. The guard stays harmless now that it does.
      - name: Check whether there is a frontend yet
        id: web
        run: |
          if [ -f web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/ does not exist yet, skipping."
          fi

      - uses: actions/setup-node@v7
        if: steps.web.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        if: steps.web.outputs.exists == 'true'
        working-directory: web
        run: npm ci

      - name: Lint
        if: steps.web.outputs.exists == 'true'
        working-directory: web
        run: npm run lint

      - name: Check formatting
        if: steps.web.outputs.exists == 'true'
        working-directory: web
        run: npx prettier --check .

      - name: Check design-token discipline
        if: steps.web.outputs.exists == 'true'
        run: bash scripts/check-tokens.sh

      - name: Check WCAG AA contrast
        if: steps.web.outputs.exists == 'true'
        run: node scripts/check-contrast.mjs

      - name: Build
        if: steps.web.outputs.exists == 'true'
        working-directory: web
        run: npm run build

      # F1 in docs/Security-Review.md: a production build must not carry a
      # bearer token. Reads the build above.
      - name: Check the build carries no token
        if: steps.web.outputs.exists == 'true'
        run: bash scripts/check-bundle-secrets.sh

      # Each screen's static invariants and its pure modules, compiled and
      # run. Their live halves need a server and a token, so they skip
      # themselves here. Before CI ran them, verify-app-shell had been
      # failing unnoticed on a renamed route.
      - name: Per-screen checks
        if: steps.web.outputs.exists == 'true'
        run: |
          for check in app-shell diary-home gig-detail entry-stepper assessor-stepper \
                       export-sheet history-sheet select-framework edit-framework; do
            bash "scripts/verify-$check.sh" || exit 1
          done

      # ADR #42. Browser checks against a fake API: no backend, no database
      # and no token, so they run here exactly as they run locally. The
      # browser comes from the pinned @playwright/test, not from latest.
      - name: Install Chromium for the browser checks
        if: steps.web.outputs.exists == 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        if: steps.web.outputs.exists == 'true'
        working-directory: web
        run: npm run test:e2e

      # A failed run's trace is the page, the network and the console at
      # every step. Kept a week, and only when something failed.
      - name: Keep the traces of a failed browser check
        if: failure() && steps.web.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
