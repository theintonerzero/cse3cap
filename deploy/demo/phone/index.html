<!doctype html>
<!--
  The presenter's phone frame (CAP-55). A Galaxy S24 Ultra screen, 384 x 832
  CSS px (1440 x 3120 at 3.75), with Android's status bar and gesture area
  around the live app, which gets what a webview in the Alumable app gets:
  384 x 784. Demo image only, never the product bundle.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reflection Diary · phone view</title>
    <link rel="stylesheet" href="phone.css" />
    <script src="phone.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <div class="device">
        <div class="screen">
          <div class="status-bar" aria-hidden="true">
            <span class="clock">9:41</span>
            <span class="camera"></span>
            <span class="status-icons">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                <path d="M12 18.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM5.6 13.6a9 9 0 0 1 12.8 0l-1.6 1.6a6.7 6.7 0 0 0-9.6 0Zm-3.2-3.2a13.6 13.6 0 0 1 19.2 0L20 12a11.3 11.3 0 0 0-16 0Z" />
              </svg>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                <path d="M3 20h3v-4H3Zm5 0h3v-8H8Zm5 0h3V8h-3Zm5 0h3V3h-3Z" />
              </svg>
              <span class="battery"><span class="battery-level"></span></span>
              <span class="battery-text">87</span>
            </span>
          </div>
          <iframe
            src="/"
            width="384"
            height="784"
            title="Reflection Diary, as on a Galaxy S24 Ultra"
          ></iframe>
          <div class="gesture-bar" aria-hidden="true"><span class="pill"></span></div>
        </div>
      </div>
    </main>
  </body>
</html>
