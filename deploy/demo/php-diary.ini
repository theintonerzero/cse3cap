; The live demo's PHP settings (CAP-54), on top of php.ini-production.
; Evidence uploads are promised up to 10 MB (db/01-schema.sql, the entry
; stepper) and both Caddies accept 101MiB, so PHP must not cut them at its
; 2M default. The same values ADR #45's PHP-FPM pool set.
upload_max_filesize = 100M
post_max_size = 101M
display_errors = Off
expose_php = Off
