; The demo's own PHP-FPM pool (CAP-26). Installed by hand as
; /etc/php/8.5/fpm/pool.d/diary.conf; see docs/Deployment.md.
;
; Its own pool, rather than www, so the demo runs as its own user, cannot
; read anything outside /var/www/diary, and a runaway request here does not
; starve anything else the box runs. MySQL for five people is on this box.

[diary]
user = diary
group = diary

; Caddy connects through this socket. Its user must be in the socket's
; group, or every /api request is a 502.
listen = /run/php/diary-fpm.sock
listen.owner = diary
listen.group = caddy
listen.mode = 0660

; A demo, not a service. ondemand keeps no idle workers on a shared box.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Laravel reads its settings from shared/.env, not from the pool.
clear_env = yes

; Nothing outside the demo's own tree and PHP's temp directory. The CA file
; for MySQL TLS is inside each release (db/letsencrypt-roots.pem).
php_admin_value[open_basedir] = /var/www/diary/:/tmp/
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off

; Evidence uploads up to a framework's 100 MiB max_file_bytes. The Caddy
; site block allows the same.
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 101M

security.limit_extensions = .php
